[package]
name = "kubelet-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
documentation.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Kubelet plugin framework for Kubernetes Dynamic Resource Allocation (DRA) drivers"
include = [
    "Cargo.toml",
    "build.rs",
    "src/**/*",
]

[features]
default = ["v1_34"]

# Kubernetes versions
v1_34 = []

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.92"
k8s-openapi = { version = "0.27.1", features = ["v1_34"] }
kube = { version = "3.1.0", features = ["derive"] }
prost = "0.14.3"
thiserror = "2.0.20"
tokio = { version = "1.50.0", features = ["fs", "macros", "net"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tokio-util = "0.7.18"
tonic = "0.14.5"
tonic-prost = "0.14.5"
tracing = "0.1.44"

[dev-dependencies]
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14.5"
